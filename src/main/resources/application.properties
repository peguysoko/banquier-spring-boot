# Nom de l'application
spring.application.name=bank

# Adresse de la base MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/banquier?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false

# ${NOM} = "va lire la variable d'environnement NOM".
# Le mot de passe n'est donc plus écrit dans ce fichier.
# ${DB_USERNAME:root} = lit DB_USERNAME, et prend "root" si elle n'existe pas.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# "none" = Spring ne touche JAMAIS à la structure de nos tables (on les a créées nous-mêmes en SQL)
spring.jpa.hibernate.ddl-auto=none

# Affiche les requêtes SQL dans la console (utile pour apprendre)
spring.jpa.show-sql=true

# Java et MySQL utilisent la même heure (UTC)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Mot de passe commun des utilisateurs de DÉMONSTRATION, lu dans l'environnement.
# Vide = aucun utilisateur de démonstration n'est créé.
demo.password=${DEMO_PASSWORD:}

# Le guichetier écoute sur la porte 8080
server.port=8080
